name: Release GitFerry

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agents:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            name: gitferry-agent-linux-x64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            name: gitferry-agent-linux-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            name: gitferry-agent-macos-x64
          - os: macos-15
            target: aarch64-apple-darwin
            name: gitferry-agent-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Configure static linker
        if: runner.os == 'Linux'
        run: |
          rust_host=$(rustc -vV | sed -n 's/^host: //p')
          linker="$(rustc --print sysroot)/lib/rustlib/$rust_host/bin/rust-lld"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=$linker" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=$linker" >> "$GITHUB_ENV"
      - name: Build agent
        run: cargo build --locked --release --target ${{ matrix.target }} -p gitferry-agent
      - name: Prepare agent artifact
        run: cp target/${{ matrix.target }}/release/gitferry-agent ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  draft:
    needs: agents
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "GitFerry $GITHUB_REF_NAME" \
            --notes "Download the installer for your operating system. macOS builds are ad-hoc signed but not notarized; Windows builds are not certificate signed."

  desktop:
    needs: [agents, draft]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'
          - os: macos-15
            args: '--target aarch64-apple-darwin --bundles dmg'
          - os: macos-15-intel
            args: '--target x86_64-apple-darwin --bundles dmg'
          - os: ubuntu-22.04
            args: '--bundles deb,appimage'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libfuse2 patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches app version
        shell: bash
        run: |
          node -e "const pkg=require('./app/package.json'); const config=require('./app/src-tauri/tauri.conf.json'); if (pkg.version !== config.version || process.env.GITHUB_REF_NAME !== 'v' + pkg.version) throw new Error('Release tag must match app version')"
      - uses: actions/download-artifact@v4
        with:
          pattern: gitferry-agent-*
          merge-multiple: true
          path: app/src-tauri/resources
      - name: Install frontend packages
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: app
        run: pnpm exec tsc --noEmit
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: GitFerry ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}

  publish:
    needs: desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
