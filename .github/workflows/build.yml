name: Build GitFerry

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      agents_only:
        description: Build only the SSH agents
        type: boolean
        required: false
        default: false
      desktop_target:
        description: Desktop platforms to build
        type: choice
        options: [all, windows]
        default: all

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      native_links: ${{ steps.native_links.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect native file-link changes
        id: native_links
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- agent/src/file_links.rs app/src-tauri/src/file_links.rs app/src-tauri/src/lib.rs app/src-tauri/Cargo.toml app/src-tauri/tauri.conf.json app/src/fileLinks.ts app/src/App.tsx app/src/FileEditor.tsx proto/src/lib.rs scripts/test_native_file_links.py; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Install frontend packages
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Check and build frontend
        working-directory: app
        run: |
          pnpm exec tsc --noEmit
          pnpm test:unit
          pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test repository operations
        run: cargo test --locked -p gitferry-agent --lib --test repository --test read_parity --test worktrees --test file_links
      - name: Test browser UI
        working-directory: app
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          cargo build --locked --manifest-path ../Cargo.toml -p gitferry-agent
          node tests/worktree-ui.cjs
          node tests/headless-smoke.cjs
          GITFERRY_FILE_LINKS_ONLY=1 node tests/headless-smoke.cjs
          GITFERRY_FIND_ONLY=1 node tests/headless-smoke.cjs
          GITFERRY_DIALOGS_ONLY=1 node tests/headless-smoke.cjs
      - name: Test word selection in WebKit
        run: |
          python3 -m venv /tmp/gitferry-webkit-venv
          /tmp/gitferry-webkit-venv/bin/pip install playwright==1.56.0
          /tmp/gitferry-webkit-venv/bin/playwright install --with-deps webkit
          /tmp/gitferry-webkit-venv/bin/python app/tests/webkit-selection.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: |
            /tmp/gitferry-headless-*/screenshots/**
            /tmp/gitferry-worktree-tabs.png
            /tmp/gitferry-webkit-*.png
          if-no-files-found: ignore

  agents:
    needs: checks
    if: github.event_name == 'workflow_dispatch' || needs.checks.outputs.native_links == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            name: gitferry-agent-linux-x64
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            name: gitferry-agent-linux-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            name: gitferry-agent-macos-x64
          - os: macos-15
            target: aarch64-apple-darwin
            name: gitferry-agent-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Configure static linker
        if: runner.os == 'Linux'
        run: |
          rust_host=$(rustc -vV | sed -n 's/^host: //p')
          linker="$(rustc --print sysroot)/lib/rustlib/$rust_host/bin/rust-lld"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=$linker" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=$linker" >> "$GITHUB_ENV"
      - name: Build agent
        run: cargo build --locked --release --target ${{ matrix.target }} -p gitferry-agent
      - name: Prepare agent artifact
        run: cp target/${{ matrix.target }}/release/gitferry-agent ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  desktop:
    if: ${{ !inputs.agents_only }}
    needs: [checks, agents]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.desktop_target == 'windows' && '["windows-latest"]' || '["windows-latest","macos-15","ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: gitferry-agent-*
          merge-multiple: true
          path: app/src-tauri/resources
      - name: Install frontend packages
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: app
        run: pnpm exec tsc --noEmit
      - name: Test native link parsing and repository resolution
        run: |
          cargo test --locked -p gitferry --lib
          cargo test --locked -p gitferry-agent --lib --test file_links
      - name: Build desktop app
        if: runner.os == 'Linux'
        working-directory: app
        run: pnpm tauri build --no-bundle --ci
      - name: Build native file-link bundles
        if: runner.os == 'Windows' || runner.os == 'macOS'
        working-directory: app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pnpm tauri build --bundles nsis --ci
          else
            pnpm tauri build --bundles dmg --ci
          fi
      - name: Prepare native file-link test bundle
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: python scripts/test_native_file_links.py --prepare
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' || runner.os == 'macOS'
        with:
          name: native-file-links-${{ matrix.os }}
          path: native-link-bundle
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: gitferry-windows-runtime
          path: |
            target/release/gitferry.exe
            app/src-tauri/resources/gitferry-agent-*
          if-no-files-found: error

  native_links:
    needs: desktop
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-file-links-${{ matrix.os }}
          path: native-link-bundle
      - name: Unpack native file-link test bundle
        run: python scripts/test_native_file_links.py --unpack
      - name: Test OS file-link handlers with MCP disabled
        run: python scripts/test_native_file_links.py
