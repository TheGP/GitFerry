<!doctype html>
<html lang="en" data-theme="antigravity">
<head><meta charset="utf-8"><title>Editor range navigation fixture</title></head>
<body>
<div class="app-shell"><div class="workspace" id="editor-fixture"></div></div>
<script type="module">
  import { createComponent } from "solid-js";
  import { render } from "solid-js/web";
  import { FileEditor } from "../src/FileEditor.tsx";
  import "../src/App.css";

  const code = Array.from({ length: 300 }, (_, i) => i % 9 === 0 ? "" : `    const value${i + 1} = ${i + 1};`);
  code[99] = "    // Wrapped context before the highlighted code.".repeat(35);
  code.splice(175, 6,
    "            const batch = await Promise.all(items.slice(start, start + BATCH_SIZE).map(async (item) => {",
    "                const found = /^(alpha|gamma)-([a-z0-9]{24})\\.json$/.exec(item);",
    "                return found ? this.loadRow(schema.parse(found[1]), found[2]) : undefined;",
    "            }));",
    "",
    "            results.push(...batch.filter((item): item is Entry => item !== undefined));");
  const options = new URLSearchParams(location.search);
  const baseline = code.join("\n");
  if (options.get("overview") === "changes") {
    code[19] = "    const editedNearTop = true;";
    code[249] = "    const editedNearBottom = true;";
    code.splice(279, 1);
    code.splice(189, 0, "    const addedInMiddle = true;");
  }
  const content = code.join("\n");
  window.navigationEffects = { saves: 0, external: 0 };
  const ranges = [
    { startLine: 176, endLine: 181, comment: "Read metadata files together instead of reading every file one by one." },
    { startLine: 246, endLine: 251, comment: "Queue work within this process so sessions do not keep trying the same lock." },
  ];
  const width = Number(options.get("width")) || 560;
  const size = Number(options.get("size")) || 13;
  document.documentElement.style.setProperty("--code-size", `${size}px`);
  document.documentElement.style.setProperty("--code-line-height", `${Math.ceil(size * 1.5)}px`);
  render(() => createComponent(FileEditor, {
    target: { repo: "/navigation-fixture", path: "example.ts", line: 176, marks: null, nonce: 1, readOnly: !options.has("editable"), annotation: { ...ranges[0], ranges } },
    active: true, conflicted: false, width, externalEditorLabel: "VS Code",
    load: async () => content,
    loadBaseline: async () => {
      if (options.get("overview") === "fail") throw new Error("Baseline connection unavailable");
      return options.get("overview") === "untracked" ? "" : baseline;
    },
    save: async () => { window.navigationEffects.saves++; throw new Error("Navigation must never save a file"); },
    onOpenExternal: async () => { window.navigationEffects.external++; throw new Error("Navigation must stay in GitFerry"); },
    onDirty: () => {}, onClose: () => {}, onClearAnnotation: () => {}, onResize: () => {}, onMarkResolved: () => {},
  }), document.getElementById("editor-fixture"));
</script>
</body>
</html>
