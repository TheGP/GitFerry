<!doctype html>
<html lang="en" data-theme="antigravity">
<head><meta charset="utf-8"><title>Editor range navigation fixture</title></head>
<body>
<div class="app-shell"><div class="workspace" id="editor-fixture"></div></div>
<script type="module">
  import { createComponent } from "solid-js";
  import { render } from "solid-js/web";
  import { FileEditor } from "../src/FileEditor.tsx";
  import "../src/App.css";

  const content = Array.from({ length: 300 }, (_, i) => `const value${i + 1} = ${i + 1};${i === 99 ? " // Wrapped context before the highlighted code.".repeat(35) : ""}`).join("\n");
  const ranges = [
    { startLine: 176, endLine: 181, comment: "Read metadata files together instead of reading every file one by one." },
    { startLine: 246, endLine: 251, comment: "Queue work within this process so sessions do not keep trying the same lock." },
  ];
  const width = Number(new URLSearchParams(location.search).get("width")) || 560;
  render(() => createComponent(FileEditor, {
    target: { repo: "/navigation-fixture", path: "example.ts", line: 176, marks: null, nonce: 1, readOnly: true, annotation: { ...ranges[0], ranges } },
    active: true, conflicted: false, width, externalEditorLabel: "VS Code",
    load: async () => content,
    save: async () => { throw new Error("Navigation must never save a file"); },
    onOpenExternal: async () => { throw new Error("Navigation must stay in GitFerry"); },
    onDirty: () => {}, onClose: () => {}, onClearAnnotation: () => {}, onResize: () => {}, onMarkResolved: () => {},
  }), document.getElementById("editor-fixture"));
</script>
</body>
</html>
