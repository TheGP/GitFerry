[package]
name = "gitferry"
version = "0.3.0"
description = "A fast Git client for local and SSH repositories"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitferry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
gitferry-agent = { path = "../../agent" }
gitferry-proto = { path = "../../proto" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2"
getrandom = "0.3"
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
schemars = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }
